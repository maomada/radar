name: kubeatlas-desktop
arch: amd64
platform: linux
version: ${VERSION}
maintainer: maomada
description: "Kubernetes visibility — topology, traffic, and Helm management"
vendor: maomada
homepage: https://github.com/maomada/radar
license: Apache-2.0
contents:
  - src: build/bin/kubeatlas-desktop
    dst: /usr/bin/kubeatlas-desktop
  - src: deploy/linux/kubeatlas-desktop.desktop
    dst: /usr/share/applications/kubeatlas-desktop.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/kubeatlas-desktop.png
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
