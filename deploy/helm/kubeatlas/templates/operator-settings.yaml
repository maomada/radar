{{- if and .Values.cloud.enabled (or .Values.audit .Values.helm.ociSources) }}
{{- fail "cloud.enabled is unavailable in KubeAtlas" }}
{{- end }}
{{- if not .Values.cloud.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radar.fullname" . }}-operator-settings
  labels:
    {{- include "radar.labels" . | nindent 4 }}
data:
  settings.json: |
    {{- include "radar.operatorSettings" . | nindent 4 }}
{{- end }}
