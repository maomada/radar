replicaCount: 1

image:
  repository: ghcr.io/maomada/radar-portal
  tag: ""
  pullPolicy: IfNotPresent

existingSecret: ""

service:
  type: ClusterIP
  port: 9290

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
