name: Release GHCR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA on main with successful CI and CodeQL
        required: true
        type: string
      version:
        description: Strict SemVer without v prefix or build metadata
        required: true
        type: string
      publish:
        description: Publish after the protected environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: owned-ghcr-release
  cancel-in-progress: false

jobs:
  guard:
    name: Guard repository and ref
    runs-on: ubuntu-latest
    steps:
      - name: Require the canonical repository main branch
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
        run: |
          if [[ "$GH_REPOSITORY" != "maomada/radar" || "$GH_REF" != "refs/heads/main" ]]; then
            echo "Release GHCR may only be dispatched from maomada/radar on main." >&2
            exit 1
          fi

  validate:
    name: Validate selected source
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      version: ${{ steps.policy.outputs.version }}
      ci_url: ${{ steps.policy.outputs.ci_url }}
      codeql_url: ${{ steps.policy.outputs.codeql_url }}
    steps:
      - name: Check out trusted release policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main for ancestry validation
        run: git -C source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate source, version, ancestry, CI, and CodeQL
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 trusted/scripts/release_policy.py \
            --source-dir source \
            --sha "$SOURCE_SHA" \
            --version "$RELEASE_VERSION" \
            > "$RUNNER_TEMP/source-evidence.json"
          python3 - "$RUNNER_TEMP/source-evidence.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              evidence = json.load(source)
          outputs = {
              "source_sha": evidence["sourceSha"],
              "version": evidence["version"],
              "ci_url": evidence["checks"]["ci.yml"],
              "codeql_url": evidence["checks"]["codeql.yml"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as destination:
              for name, value in outputs.items():
                  destination.write(f"{name}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Source validation passed\n\n")
              summary.write(f"- Source: `{evidence['sourceSha']}`\n")
              summary.write(f"- Version: `{evidence['version']}`\n")
              summary.write(f"- CI: [{evidence['checks']['ci.yml']}]({evidence['checks']['ci.yml']})\n")
              summary.write(f"- CodeQL: [{evidence['checks']['codeql.yml']}]({evidence['checks']['codeql.yml']})\n")
          PY

  build-images:
    name: Build ${{ matrix.component }} OCI archive
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: radar
            dockerfile: Dockerfile
          - component: radar-portal
            dockerfile: Dockerfile.portal
    steps:
      - name: Check out trusted archive validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-platform OCI archive
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          target: full
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.component }}.oci.tar
          provenance: false
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            SOURCE_REVISION=${{ needs.validate.outputs.source_sha }}
      - name: Validate archive platforms and image configs
        env:
          ARCHIVE: ${{ runner.temp }}/${{ matrix.component }}.oci.tar
        run: |
          python3 trusted/scripts/validate_oci_archive.py validate --archive "$ARCHIVE"
      - name: Record archive checksum and build metadata
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sha256sum "$RUNNER_TEMP/$COMPONENT.oci.tar" > "$RUNNER_TEMP/$COMPONENT.oci.tar.sha256"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = {
              "component": os.environ["COMPONENT"],
              "sourceSha": os.environ["SOURCE_SHA"],
              "version": os.environ["RELEASE_VERSION"],
              "buildDigest": os.environ["BUILD_DIGEST"] or None,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / f"{metadata['component']}.metadata.json"
          path.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload component release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/${{ matrix.component }}.oci.tar
            ${{ runner.temp }}/${{ matrix.component }}.oci.tar.sha256
            ${{ runner.temp }}/${{ matrix.component }}.metadata.json
          if-no-files-found: error
          retention-days: 14

  charts:
    name: Package version-aligned Helm charts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Stage and package both charts
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 trusted/scripts/release_chart_package.py \
            --source-dir source \
            --output-dir "$RUNNER_TEMP/charts" \
            --version "$RELEASE_VERSION" \
            --sha "$SOURCE_SHA"
      - name: Upload packaged charts and checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-charts
          path: |
            ${{ runner.temp }}/charts/*.tgz
            ${{ runner.temp }}/charts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  dry-run-report:
    name: Record dry-run evidence
    needs: [validate, build-images, charts]
    if: ${{ inputs.publish != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-artifacts/images
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          name: release-charts
          path: ${{ runner.temp }}/release-artifacts/charts
      - name: Create dry-run manifest and summary
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifacts
          MANIFEST: ${{ runner.temp }}/release-manifest.json
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          CI_URL: ${{ needs.validate.outputs.ci_url }}
          CODEQL_URL: ${{ needs.validate.outputs.codeql_url }}
        run: |
          python3 trusted/scripts/release_manifest.py create \
            --artifact-root "$ARTIFACT_ROOT" \
            --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION" \
            --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ci-url "$CI_URL" --codeql-url "$CODEQL_URL" \
            --output "$MANIFEST"
          python3 trusted/scripts/release_manifest.py summary --manifest "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish owned GHCR images and charts
    needs: [validate, build-images, charts]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment:
      name: ghcr-publish
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main for ancestry revalidation
        run: git -C source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-artifacts/images
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          name: release-charts
          path: ${{ runner.temp }}/release-artifacts/charts
      - name: Create release manifest
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifacts
          MANIFEST: ${{ runner.temp }}/release-manifest.json
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          CI_URL: ${{ needs.validate.outputs.ci_url }}
          CODEQL_URL: ${{ needs.validate.outputs.codeql_url }}
        run: |
          python3 trusted/scripts/release_manifest.py create \
            --artifact-root "$ARTIFACT_ROOT" \
            --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION" \
            --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ci-url "$CI_URL" --codeql-url "$CODEQL_URL" --publish \
            --output "$MANIFEST"
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Log in to GHCR for image inspection and copies
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate source after environment approval
        id: revalidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 trusted/scripts/release_policy.py \
            --source-dir source --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" \
            > "$RUNNER_TEMP/source-evidence.json"
      - name: Update manifest with final CI and CodeQL evidence
        if: ${{ steps.revalidate.outcome == 'success' }}
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest.json
          EVIDENCE: ${{ runner.temp }}/source-evidence.json
        run: |
          python3 - "$MANIFEST" "$EVIDENCE" <<'PY'
          import json
          import sys
          manifest_path, evidence_path = sys.argv[1:3]
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          evidence = json.load(open(evidence_path, encoding="utf-8"))
          manifest["checks"] = {
              "ci": evidence["checks"]["ci.yml"],
              "codeql": evidence["checks"]["codeql.yml"],
          }
          with open(manifest_path, "w", encoding="utf-8") as destination:
              json.dump(manifest, destination, indent=2, sort_keys=True)
              destination.write("\n")
          PY
      - name: Check all four target refs before any push
        id: preflight
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if ! python3 trusted/scripts/release_registry.py \
            --authfile "$HOME/.docker/config.json" --version "$RELEASE_VERSION"; then
            python3 trusted/scripts/release_manifest.py preflight \
              --manifest "$RUNNER_TEMP/release-manifest.json" --status blocked
            exit 1
          fi
          python3 trusted/scripts/release_manifest.py preflight \
            --manifest "$RUNNER_TEMP/release-manifest.json" --status passed
      - name: Copy Radar image archive to GHCR
        id: push-radar
        env:
          TARGET_REF: ghcr.io/maomada/radar:${{ needs.validate.outputs.version }}
          ARCHIVE: ${{ runner.temp }}/release-artifacts/images/release-image-radar/radar.oci.tar
          MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar --status attempted
          if ! skopeo copy --all --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "oci-archive:$ARCHIVE" "docker://$TARGET_REF"; then
            python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar --status push-failed-or-unknown
            exit 1
          fi
          DIGEST="$(skopeo inspect --format '{{.Digest}}' --authfile "$HOME/.docker/config.json" "docker://$TARGET_REF")"
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar --status published --digest "$DIGEST"
      - name: Copy Radar Portal image archive to GHCR
        id: push-radar-portal
        env:
          TARGET_REF: ghcr.io/maomada/radar-portal:${{ needs.validate.outputs.version }}
          ARCHIVE: ${{ runner.temp }}/release-artifacts/images/release-image-radar-portal/radar-portal.oci.tar
          MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar-portal --status attempted
          if ! skopeo copy --all --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "oci-archive:$ARCHIVE" "docker://$TARGET_REF"; then
            python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar-portal --status push-failed-or-unknown
            exit 1
          fi
          DIGEST="$(skopeo inspect --format '{{.Digest}}' --authfile "$HOME/.docker/config.json" "docker://$TARGET_REF")"
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind image --name radar-portal --status published --digest "$DIGEST"
      - name: Log in to GHCR for chart push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push Radar chart
        id: push-radar-chart
        env:
          TARGET_REF: ghcr.io/maomada/charts/radar:${{ needs.validate.outputs.version }}
          ARCHIVE: ${{ runner.temp }}/release-artifacts/charts/radar-${{ needs.validate.outputs.version }}.tgz
          MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar --status attempted
          if ! PUSH_RESULT="$(helm push "$ARCHIVE" oci://ghcr.io/maomada/charts 2>&1)"; then
            printf '%s\n' "$PUSH_RESULT"
            python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar --status push-failed-or-unknown
            exit 1
          fi
          printf '%s\n' "$PUSH_RESULT"
          DIGEST="$(printf '%s\n' "$PUSH_RESULT" | awk '/^Digest: / { print $2 }' | tail -n 1)"
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar --status published --digest "$DIGEST"
      - name: Push Radar Portal chart
        id: push-radar-portal-chart
        env:
          TARGET_REF: ghcr.io/maomada/charts/radar-portal:${{ needs.validate.outputs.version }}
          ARCHIVE: ${{ runner.temp }}/release-artifacts/charts/radar-portal-${{ needs.validate.outputs.version }}.tgz
          MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar-portal --status attempted
          if ! PUSH_RESULT="$(helm push "$ARCHIVE" oci://ghcr.io/maomada/charts 2>&1)"; then
            printf '%s\n' "$PUSH_RESULT"
            python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar-portal --status push-failed-or-unknown
            exit 1
          fi
          printf '%s\n' "$PUSH_RESULT"
          DIGEST="$(printf '%s\n' "$PUSH_RESULT" | awk '/^Digest: / { print $2 }' | tail -n 1)"
          python3 trusted/scripts/release_manifest.py target --manifest "$MANIFEST" --kind chart --name radar-portal --status published --digest "$DIGEST"
      - name: Finalize release summary
        if: always()
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest.json
          JOB_RESULT: ${{ job.status }}
          VALIDATION_OUTCOME: ${{ steps.revalidate.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          if [[ -f "$MANIFEST" && -f trusted/scripts/release_manifest.py ]]; then
            python3 trusted/scripts/release_manifest.py finalize \
              --manifest "$MANIFEST" --job-result "$JOB_RESULT" \
              --validation-outcome "$VALIDATION_OUTCOME" --preflight-outcome "$PREFLIGHT_OUTCOME"
            python3 trusted/scripts/release_manifest.py summary --manifest "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release stopped before a manifest could be assembled; inspect preceding job steps." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: warn
          retention-days: 90
